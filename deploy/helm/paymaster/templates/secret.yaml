{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{/*
Chart-managed Secret. For dev/throwaway environments ONLY: the values live in Helm release history
in plaintext. In production set secrets.existingSecret to a Secret synced from a real secret store
(External Secrets Operator, Vault Agent, SOPS) and leave secrets.create false.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paymaster.fullname" . }}
  labels:
    {{- include "paymaster.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
