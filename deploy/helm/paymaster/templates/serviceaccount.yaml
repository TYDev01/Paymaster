{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "paymaster.serviceAccountName" . }}
  labels:
    {{- include "paymaster.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The backend calls no Kubernetes API, so its token buys an attacker nothing — do not mount it.
automountServiceAccountToken: false
{{- end }}
