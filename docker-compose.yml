# Development stack: Postgres, Redis, a self-hosted bundler, and the paymaster backend.
#
# td2.md asks for Docker Compose for development and Kubernetes/Helm for production. This is the
# former. It is NOT a production deployment: it uses trust auth, no TLS, no resource limits, and
# a dev signing key. See docs/ for the production path.
#
# The bundler is Rundler, Alchemy's ERC-4337 bundler, open source under Apache-2.0/MIT. td2.md
# prohibits the Alchemy *hosted* bundler service; this runs the open-source binary on our own
# infrastructure, which td2.md calls "acceptable and preferred". No request leaves this stack.

name: paymaster

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paymaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: paymaster
    ports:
      # Host port is overridable because a developer machine very often already runs Postgres on
      # 5432; the default is unchanged. Nothing inside the stack uses the host port — the backend
      # reaches postgres over the compose network — so remapping this costs nothing.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone reports the postmaster up before it accepts queries; the -d flag makes
      # it check the database the backend will actually connect to.
      test: ["CMD-SHELL", "pg_isready -U paymaster -d paymaster"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # appendonly on: quota counters are not precious, but losing them all at once hands every
    # caller a fresh quota, which is a spend event rather than a data-loss event.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A local chain for development. In a real deployment this is replaced by RPC endpoints in the
  # CHAINS config; nothing else in the stack changes.
  bundler:
    image: alchemyplatform/rundler:v0.11.0
    environment:
      # A built-in rundler chain spec, which is why there is no chain.toml any more: the old one
      # existed ONLY because rundler ships no spec for chain id 31337. Its own comment said to
      # delete it and set NETWORK for a real chain, and that is what this is.
      NETWORK: ethereum_sepolia
      # A real Sepolia endpoint. There is no anvil to fall back to, so an unset or rate-limited
      # value here is a bundler that starts and then serves nothing — prefer a provider endpoint
      # to a public one, because rundler polls this hard.
      NODE_HTTP: ${SEPOLIA_RPC_URL:?set SEPOLIA_RPC_URL in .env}
      ENABLED_ENTRY_POINTS: v0.7
      RPC_PORT: "3001"
      RPC_HOST: 0.0.0.0
      METRICS_PORT: "8081"
      # THE REASON THIS IS HERE. Rundler's stock minimum is 1 ETH, and the Sepolia paymaster is
      # staked 0.021 — a testnet-sized number, because the stake comes out of a faucet. Left at
      # the default, rundler rejects every single operation with -32502 before it reaches the
      # chain, and the error names the bundler rather than the stake. Must be <= the on-chain
      # stake; see STAKE_WEI in contracts/.env.
      MIN_STAKE_VALUE: "${MIN_STAKE_VALUE:-21000000000000000}"
      # The EOA that submits bundles, and PAYS FOR THEM in real Sepolia ETH. There is deliberately
      # no default: the old one was anvil's well-known key, which holds nothing on a public chain,
      # so a missing value used to produce a bundler that ran and silently landed no bundle. In
      # production this is a KMS key (rundler supports --signer.aws_kms_key_ids), never inline.
      SIGNER_PRIVATE_KEYS: ${BUNDLER_SIGNER_KEY:?set BUNDLER_SIGNER_KEY in .env - a FUNDED Sepolia EOA}
      # UNSAFE is deliberately NOT set. Safe mode enforces the ERC-7562 storage rules, which is
      # what requires our paymaster to be staked. Running unsafe here would hide a misconfiguration
      # that every production bundler would then reject.
    command: ["node"]
    ports:
      - "127.0.0.1:${BUNDLER_HOST_PORT:-3001}:3001"
      - "127.0.0.1:${BUNDLER_METRICS_HOST_PORT:-8081}:8081"
    healthcheck:
      # A real JSON-RPC round trip, spoken over bash's /dev/tcp. The rundler image ships neither
      # wget nor curl, so the obvious probe silently never passes: the container sits in
      # "health: starting" forever, and anything waiting on `condition: service_healthy` for it
      # would hang indefinitely rather than fail. bash is present, and this needs nothing else.
      #
      # It asserts the RPC ANSWERS, not merely that the port is open — rundler accepts connections
      # before it is ready to serve, so a TCP-connect check would report healthy too early.
      #
      # The `$$` are escapes: compose interpolates `$` itself, so a single `$` here would be
      # substituted at parse time and the container would receive an empty string.
      test:
        - CMD
        - bash
        - -c
        - >-
          body='{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}';
          exec 3<>/dev/tcp/127.0.0.1/3001 || exit 1;
          printf 'POST / HTTP/1.1\r\nHost: localhost\r\nContent-Type: application/json\r\nContent-Length: %d\r\nConnection: close\r\n\r\n%s' "$${#body}" "$$body" >&3;
          grep -q '"result"' <&3
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://paymaster:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/paymaster
      REDIS_URL: redis://redis:6379
      # Customer dashboard sign-in. All optional: unset, /auth/* answers 503 IDENTITY_DISABLED and
      # the rest of the paymaster is unaffected — a deployment that only sponsors its own dApp
      # never needs any of this. ./start.sh fills them in for the devnet.
      PRIVY_APP_ID: "${PRIVY_APP_ID:-}"
      ADMIN_JWT_SECRET: "${ADMIN_JWT_SECRET:-}"
      TENANT_SELF_SIGNUP: "${TENANT_SELF_SIGNUP:-false}"
      # No defaults for either: the service must refuse to start rather than invent a signing key
      # or run unauthenticated. Generate with `npm run key:generate` in backend/.
      SPONSORSHIP_SIGNER_KEY: "${SPONSORSHIP_SIGNER_KEY:?set SPONSORSHIP_SIGNER_KEY in .env}"
      BOOTSTRAP_API_KEY: "${BOOTSTRAP_API_KEY:?set BOOTSTRAP_API_KEY in .env - generate one with npm run key:generate}"
      CHAINS: "${CHAINS:?set CHAINS in .env - see backend/.env.example}"
      # With a database, policies come from it — and a fresh database has none, so the quickstart
      # would fail naming a policy nobody was told to create. Seeds the bootstrap policy into an
      # EMPTY policy table only. Off by default everywhere else; in production, policies are the
      # operator's deliberate act.
      BOOTSTRAP_DEFAULT_POLICY: "${BOOTSTRAP_DEFAULT_POLICY:-true}"
      # Tracing is off unless asked for: with no collector running, an enabled exporter would just
      # log a failed POST every few seconds. Bring up the monitoring profile first, then set
      # OTEL_TRACES_ENABLED=true in .env.
      OTEL_TRACES_ENABLED: "${OTEL_TRACES_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
      OTEL_SERVICE_NAME: paymaster
    ports:
      # 3100 on the host, still 3000 in the container. The public site (web/) owns 3000 because
      # that is the address a person types; nothing about the backend's own port changed, so Helm
      # and every in-cluster address are untouched.
      - "127.0.0.1:${BACKEND_HOST_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # --------------------------------------------------------------------------------------------
  # Monitoring, behind a profile: `docker compose --profile monitoring up`.
  #
  # Profiled rather than default because the core stack is what a developer needs to sponsor an
  # operation, and three more containers is a slower, heavier default for that. Everything here is
  # configuration-only — the backend exports /metrics and OTLP spans whether or not these are up.
  # --------------------------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Enough to see a trend over a weekend; this is a dev stack, not a metrics archive.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.5.1
    profiles: [monitoring]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Dev only. Anonymous admin is exactly the thing the production Helm chart does not do.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"

  # Terminates OTLP from the backend. A collector rather than a direct export to a tracing backend
  # so swapping Tempo for Jaeger for a hosted vendor is a change to THIS file, not to the service.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    profiles: [monitoring]
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./deploy/monitoring/otel:/etc/otel:ro
    ports:
      - "127.0.0.1:4318:4318" # OTLP/HTTP — what the backend posts to
      - "127.0.0.1:4317:4317" # OTLP/gRPC — for anything else you point at it

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
